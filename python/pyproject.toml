[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nzdata"
version = "0.1.0"
description = "Keyless-first connectors for NZ public data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oli Treadwell", email = "oliver.treadwell@gmail.com" }]
keywords = ["new-zealand", "open-data", "stats-nz", "linz", "geonet"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/olitreadwell/nz-open-data-connectors"
Repository = "https://github.com/olitreadwell/nz-open-data-connectors"
Documentation = "https://github.com/olitreadwell/nz-open-data-connectors/tree/main/python"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nzdata = ["fixtures/*.json", "fixtures/*.xml", "fixtures/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
