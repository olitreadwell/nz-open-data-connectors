AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  SuggestExtensions: false
  Exclude:
    - 'lib/nzdata/fixtures/**/*'
    - 'spec/**/*'
    - 'nzdata.gemspec'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 100

Metrics/ModuleLength:
  Max: 400

Metrics/MethodLength:
  Max: 40

Metrics/AbcSize:
  Max: 50

Metrics/ClassLength:
  Max: 200

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Style/Documentation:
  Enabled: false

# Struct members mirror the Python/TypeScript port surface (e.g. :count).
Lint/StructNewOverride:
  Enabled: false

# Reader names mirror the TS/Python ports (get_data, get_catalogue, ...).
Naming/AccessorMethodName:
  Enabled: false
